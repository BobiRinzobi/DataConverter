name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DDATACONV_BUILD_TESTS=ON

      - name: Build application and tests
        run: cmake --build build --config Debug --parallel 2

      - name: Run tests and generate report
        run: ctest --test-dir build -C Debug --output-on-failure --output-junit build/test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: warn